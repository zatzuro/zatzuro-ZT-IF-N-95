name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: supabase start -x studio,mailpit,analytics,vector,imgproxy
      - run: supabase db reset --local
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
